<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoConsult by Crimzn</title>

  <!-- Phantom Wallet Adapter -->
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.73.2/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-wallets@0.13.10/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-base@0.9.15/lib/cjs/index.umd.js"></script>

  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 2em;
    }
    .price-bar {
      margin: 20px 0;
    }
    .button-link, .pay-button, .solana-button, .submit-button {
      font-family: monospace;
      font-weight: bold;
      font-size: 16px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 8px;
      transition: background-color 0.2s ease;
    }
    .submit-button {
      background-color: #f7931a;
      color: black;
    }
    .pay-button {
      background-color: #0275d8;
      color: white;
    }
    .tip-button {
      background-color: #ffcc00;
      color: black;
    }
    .solana-button {
      background-color: #551bf9;
      color: white;
    }
    .solana-button:hover {
      background-color: #7d38f7;
    }
    .pulse-button {
      background-color: orange;
      color: black;
      font-weight: bold;
    }
    .bot-response {
      color: #0f0;
      margin-top: 10px;
    }
    .user-message {
      color: #f7931a;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>CryptoConsult by Crimzn</h1>

  <div id="wallet-connect">
    <button id="connect-wallet" class="solana-button">Connect Wallet</button>
    <button id="disconnect-wallet" class="solana-button" style="display:none;">Disconnect</button>
    <div id="wallet-address"></div>
  </div>

  <div class="price-bar">
    <p>BTC: <span id="btc-price">Loading...</span></p>
    <p>ETH: <span id="eth-price">Loading...</span></p>
    <p>SOL: <span id="sol-price">Loading...</span></p>
  </div>

  <strong>💬 Talk to CrimznBot</strong>
  <div id="chat-container" style="border: 1px solid #f7931a; padding: 10px; height: 200px; overflow-y: auto;"></div>
  <input type="text" id="user-input" placeholder="Ask your crypto question..." />
  <button class="submit-button" onclick="sendMessage()">Send</button>

  <br/>
  <button class="pay-button" onclick="window.open('https://commerce.coinbase.com/checkout/0193a8a5-c86f-407d-b5d7-6f8964fudf8', '_blank')">🧠 Pay for Consultation</button>
  <button class="tip-button" onclick="window.open('https://commerce.coinbase.com/checkout/ee5ff5c3-6bc2-4c0e-874a-f90eb787cd10', '_blank')">⚠️ Tip Crimzn (1 USDC)</button>
  <button class="solana-button" onclick="window.location.href='solana:Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF?amount=0.025&label=CryptoConsult&message=Consult+Tip'">🟣 Pay with Solana (0.025 SOL)</button>
  <button class="button-link" onclick="window.open('https://t.me/crimznbot', '_blank')">🤖 Chat with CrimznBot</button>

  <br/><br/>
  <input type="text" id="pulse-input" placeholder="PulseIt sentiment..." />
  <button class="pulse-button">PulseIt</button>

  <br/><br/>
  <a href="radar.html" class="button-link">🛰️ Cycle Top Radar</a>
  <a href="whitepaper.html" class="button-link">📄 View Whitepaper</a>

  <!-- 🔥 BTC Dominance Chart -->
  <h2>📊 BTC Dominance</h2>
  <iframe
    src="https://www.tradingview.com/widgetembed/?frameElementId=tradingview_btc_dominance&symbol=CRYPTOCAP:BTC.D&interval=D&theme=dark&style=1&toolbar_bg=f1f3f6&locale=en"
    width="100%"
    height="500"
    frameborder="0">
  </iframe>

  <!-- 🌡️ Altcoin Heatmap -->
  <h2>🧊 Altcoin Heatmap</h2>
  <iframe
    src="https://s.tradingview.com/embed-widget/screener/?locale=en#%7B%22defaultColumn%22%3A%22overview%22%2C%22defaultScreen%22%3A%22crypto_mkt%22%2C%22market%22%3A%22crypto%22%2C%22colorTheme%22%3A%22dark%22%2C%22width%22%3A%22100%25%22%2C%22height%22%3A400%2C%22isTransparent%22%3Afalse%2C%22showToolbar%22%3Afalse%7D"
    width="100%"
    height="400"
    frameborder="0">
  </iframe>

  <!-- ❌ Remove deploy number footer -->
  <script>
    const unwantedText = [...document.body.querySelectorAll('p')].find(p => p.textContent.toLowerCase().includes('deploy #'));
    if (unwantedText) unwantedText.remove();
  </script>

  <script>
    const connectBtn = document.getElementById('connect-wallet');
    const disconnectBtn = document.getElementById('disconnect-wallet');
    const walletDiv = document.getElementById('wallet-address');
    let provider = null;

    connectBtn.addEventListener('click', async () => {
      try {
        provider = window.solana;
        if (!provider || !provider.isPhantom) throw new Error("Phantom wallet not found");
        const resp = await provider.connect();
        walletDiv.innerText = 'Connected: ' + resp.publicKey.toString().slice(-4);
        connectBtn.style.display = 'none';
        disconnectBtn.style.display = 'inline-block';
      } catch (err) {
        console.error('Wallet connect failed:', err);
      }
    });

    disconnectBtn.addEventListener('click', async () => {
      try {
        if (provider && provider.disconnect) await provider.disconnect();
        walletDiv.innerText = '';
        connectBtn.style.display = 'inline-block';
        disconnectBtn.style.display = 'none';
      } catch (err) {
        console.error('Wallet disconnect failed:', err);
      }
    });

    async function fetchPrices() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd");
        const data = await res.json();
        document.getElementById("btc-price").innerText = "$" + data.bitcoin.usd.toLocaleString();
        document.getElementById("eth-price").innerText = "$" + data.ethereum.usd.toLocaleString();
        document.getElementById("sol-price").innerText = "$" + data.solana.usd.toLocaleString();
      } catch (error) {
        console.error("Price fetch error:", error);
      }
    }

    fetchPrices();
    setInterval(fetchPrices, 30000);

    function sendMessage() {
      const input = document.getElementById("user-input");
      const chat = document.getElementById("chat-container");
      const msg = input.value.trim();
      if (!msg) return;

      chat.innerHTML += `<div class="user-message">🧍 ${msg}</div>`;
      input.value = "";

      setTimeout(() => {
        chat.innerHTML += `<div class="bot-response">🤖 ${msg.includes("price") ? "Check live prices above ⬆️" : "CrimznBot here. Let's talk crypto."}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 500);
    }
  </script>
</body>
</html>
