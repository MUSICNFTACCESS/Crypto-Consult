<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoConsult by Crimzn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="script.js"></script>
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: Courier, monospace;
      padding: 20px;
      text-align: center;
    }
    h1 {
      font-size: 2em;
    }
    .section {
      margin-bottom: 40px;
    }
    .price-tag {
      font-size: 1.2em;
      margin: 5px;
    }
    input, button {
      font-family: inherit;
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 6px;
    }
    input {
      width: 70%;
    }
    button {
      background: #f7931a;
      color: #000;
      cursor: pointer;
    }
    .chat-box, .pulse-box {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: left;
    }
    a.button-link {
      display: inline-block;
      margin: 5px;
      padding: 10px 15px;
      background: #222;
      color: #f7931a;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>CryptoConsult by Crimzn</h1>

  <div class="section">
    <div class="price-tag">BTC: <span id="btc-price">Loading...</span></div>
    <div class="price-tag">ETH: <span id="eth-price">Loading...</span></div>
    <div class="price-tag">SOL: <span id="sol-price">Loading...</span></div>
  </div>

  <div class="section">
    <h2>Talk to CrimznBot</h2>
    <input id="user-input" placeholder="Ask me anything..." />
    <button id="ask-btn">Ask</button>
    <div id="chat-output" class="chat-box"></div>
  </div>

  <div class="section">
    <h2>PulseIt Sentiment Analyzer</h2>
    <input id="pulse-input" placeholder="Enter news or phrase..." />
    <button id="pulse-btn">Analyze</button>
    <div id="pulse-output" class="pulse-box"></div>
  </div>

  <div class="section">
    <h2>Support & Payments</h2>
    <div>
      <strong>Pay to Unlock CrimznBot:</strong><br />
      <a href="solana:Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF?amount=0.025&label=CryptoConsult%20Access" target="_blank">
        <img src="solana-logo.svg" alt="Pay with Solana" style="width:80px;height:auto;" />
      </a>
      <div>← Tap logo to pay 0.025 SOL</div>
    </div>
  </div>

  <div class="section">
    <h2>ETF Inflows</h2>
    <a class="button-link" href="https://www.farside.co.uk/ETFs/BTC" target="_blank">BTC ETF Flow Tracker</a>
    <a class="button-link" href="https://pro.nansen.ai/etf-portal" target="_blank">ETH ETF Flow Tracker</a>
  </div>

  <div class="section">
    <h2>Market Radar</h2>
    <iframe src="/blog/2025-06-13.html" style="width:100%;height:300px;border:none;"></iframe>
  </div>
</body>
</html>
