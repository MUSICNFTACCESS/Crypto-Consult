<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoConsult by Crimzn</title>
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.73.2/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-wallets@1.10.10/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-base@0.9.15/lib/index.umd.js"></script>
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    .solana-button, .submit-button {
      font-family: monospace;
      padding: 10px;
      margin: 5px;
      background-color: #a259ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .solana-button:hover {
      background-color: #7b2cbf;
    }
    .button-link {
      color: #f7931a;
      margin: 0 5px;
      text-decoration: none;
    }
    .user-message {
      color: #f7931a;
    }
    .bot-response {
      color: #00ff99;
    }
  </style>
</head>
<body>

<h1>CryptoConsult by Crimzn</h1>
<p><code>crypto-consult.onrender.com</code></p>

<div class="price">
  SOL: <span id="sol-price">Loading...</span>
</div>

<div style="color: #f7931a; padding: 10px; height: 20px;">
  🧠 <strong>Talk to CrimznBot</strong>
</div>

<input id="user-input" type="text" placeholder="Ask your crypto question..." class="solana-button" style="width: 60%;" />
<button id="send-button" class="solana-button">🔐 Send</button>

<br><br>

<!-- Payment Buttons -->
<button class="solana-button" onclick="window.open('https://commerce.coinbase.com/checkout/0193b9a5-c85f-407d-b5d7-6f896d67d70f','_blank')">💼 Pay for Consultation</button>
<button class="solana-button" onclick="window.open('https://commerce.coinbase.com/checkout/cf57aa38-2c6f-4175-b70d-b03aaa5555aa','_blank')">💸 Tip (1 USDC)</button>
<button class="solana-button">💬 Chat with CrimznBot</button>
<button class="solana-button" onclick="window.open('solana:Pay?recipient=Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF&amount=1&spl-token=So11111111111111111111111111111111111111112','_blank')">🟣 Pay with Solana</button>

<!-- PulseIt Section -->
<div id="pulseit-interface" style="margin-top: 30px;">
  <label for="pulse-input" style="color: white;">PulseIt Sentiment:</label><br>
  <input type="text" id="pulse-input" placeholder="Enter your sentiment here..." style="padding: 8px; width: 65%; border-radius: 5px; border: none;" />
  <button id="pulseit-button" class="solana-button">📊 PulseIt</button>
</div>

<br>

<!-- Footer Links -->
<a href="/blog.html" class="button-link">📉 Cycle Top Radars</a> |
<a href="/whitepaper.html" class="button-link">📄 View Whitepaper</a>

<!-- Wallet Connect -->
<br><br>
<button id="connect-wallet" class="solana-button">Connect Wallet</button>
<button id="disconnect-wallet" class="solana-button" style="display: none;">Disconnect</button>
<p>Wallet Address: <span id="wallet-address"></span></p>

<!-- Live Prices -->
<p>
  🟠 BTC: <span id="btc-price">Loading...</span><br>
  🔵 ETH: <span id="eth-price">Loading...</span><br>
  🟣 SOL: <span id="solana-price">Loading...</span>
</p>

<div id="chat-container"></div>

<script>
// Wallet Connect
const connectBtn = document.getElementById('connect-wallet');
const disconnectBtn = document.getElementById('disconnect-wallet');
const walletAddress = document.getElementById('wallet-address');

connectBtn.addEventListener('click', async () => {
  try {
    if (!window.solana || !window.solana.isPhantom) throw new Error("Phantom wallet not found");
    const resp = await window.solana.connect();
    walletAddress.textContent = resp.publicKey.toString().slice(-4);
    connectBtn.style.display = "none";
    disconnectBtn.style.display = "inline-block";
  } catch (err) {
    console.error('Wallet connect failed:', err);
  }
});

disconnectBtn.addEventListener('click', async () => {
  try {
    await window.solana.disconnect();
    walletAddress.textContent = '';
    connectBtn.style.display = "inline-block";
    disconnectBtn.style.display = "none";
  } catch (err) {
    console.error('Wallet disconnect failed:', err);
  }
});

// Prices
async function fetchPrices() {
  try {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd");
    const data = await res.json();
    document.getElementById("btc-price").innerText = '$' + data.bitcoin.usd.toLocaleString();
    document.getElementById("eth-price").innerText = '$' + data.ethereum.usd.toLocaleString();
    document.getElementById("solana-price").innerText = '$' + data.solana.usd.toLocaleString();
    document.getElementById("sol-price").innerText = '$' + data.solana.usd.toLocaleString();
  } catch (error) {
    console.error('Price fetch error:', error);
  }
}
setInterval(fetchPrices, 30000);
fetchPrices();

// CrimznBot
let questionCount = 0;
const maxFreeQuestions = 3;

document.getElementById('send-button').addEventListener('click', async () => {
  const input = document.getElementById('user-input');
  const question = input.value.trim();
  const chat = document.getElementById('chat-container');
  if (!question) return;

  chat.innerHTML = `<div class="user-message">🟧 ${question}</div>`;

  if (questionCount >= maxFreeQuestions) {
    chat.innerHTML += `
      <div class="bot-response">
        🧠 You've hit the free question limit. Please choose a payment option to continue:<br><br>
        💼 <a href="https://commerce.coinbase.com/checkout/0193b9a5-c85f-407d-b5d7-6f896d67d70f" class="button-link" target="_blank">Pay $99.99 USDC</a><br>
        💸 <a href="https://commerce.coinbase.com/checkout/cf57aa38-2c6f-4175-b70d-b03aaa5555aa" class="button-link" target="_blank">Tip 1 USDC</a><br>
        🟣 <a href="solana:Pay?recipient=Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF&amount=1&spl-token=So11111111111111111111111111111111111111112" class="button-link" target="_blank">Pay with Solana</a><br>
        📩 <a href="https://t.me/crimznbot" class="button-link" target="_blank">Contact on Telegram</a>
      </div>`;
    input.value = '';
    return;
  }

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    chat.innerHTML += `<div class="bot-response">💬 ${data.reply}</div>`;
    questionCount++;
  } catch (err) {
    console.error(err);
    chat.innerHTML += `<div class="bot-response">⚠️ Error connecting CrimznBot</div>`;
  }
  input.value = '';
});

// PulseIt
document.getElementById('pulseit-button').addEventListener('click', () => {
  const sentiment = document.getElementById('pulse-input').value.trim();
  if (!sentiment) return alert("Please enter a sentiment.");
  alert("📊 PulseIt submitted: " + sentiment);
  document.getElementById('pulse-input').value = '';
});
</script>
</body>
</html>
