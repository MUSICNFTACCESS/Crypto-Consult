<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CryptoConsult by Crimzn</title>

  <!-- Phantom Wallet Adapter -->
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.73.2/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-wallets@0.19.10/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-base@0.9.15/lib/cjs/index.umd.js"></script>

  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px;
    }
    .price-bar {
      font-size: 20px;
    }
    .pay-button, .tip-button, .solana-button, .submit-button {
      font-family: monospace;
      font-size: 14px;
      margin: 10px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .pay-button {
      background-color: #f7931a;
    }
    .tip-button {
      background-color: #0075ff;
    }
    .solana-button {
      background-color: green;
    }
    .submit-button {
      background-color: #f7931a;
      color: #000;
    }
    .submit-button:hover {
      background-color: #c87617;
    }
    .bot-response {
      color: #0f0;
      margin-top: 10px;
    }
    .user-message {
      color: #f7931a;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>CryptoConsult by Crimzn</h1>

  <div id="wallet-connect">
    <button id="connect-wallet" class="solana-button">Connect Wallet</button>
    <button id="disconnect-wallet" class="solana-button" style="display: none;">Disconnect</button>
    <div id="wallet-address"></div>
  </div>

  <div class="price-bar">
    <p>BTC: <span id="btc-price">Loading...</span></p>
    <p>ETH: <span id="eth-price">Loading...</span></p>
    <p>SOL: <span id="sol-price">Loading...</span></p>
  </div>

  <strong>💬 Talk to CrimznBot</strong>
  <div id="chat-container" style="border: 1px solid #f7931a; padding: 10px; height: 200px; overflow-y: auto;"></div>
  <input type="text" id="user-input" placeholder="Ask your crypto question..." />
  <button class="submit-button" onclick="sendMessage()">Send</button>

  <br/><br/>
  <button class="pay-button" onclick="window.open('https://commerce.coinbase.com/checkout/0193a8a5-c86f-407d-b5d7-6f896d67fdf8', '_blank')">💰 Pay for Consult</button>
  <button class="tip-button" onclick="window.open('https://commerce.coinbase.com/checkout/ee5f73e0-5ecf-4754-b700-b032ba1e4ed2', '_blank')">🪙 Tip (1 USDC)</button>
  <button class="solana-button" onclick="window.location.href='solana:Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF?amount=1&reference=CryptoConsult&spl-token=So11111111111111111111111111111111111111112'">⚡ Pay with Solana</button>
  <button class="solana-button" onclick="window.open('https://t.me/crimznbot', '_blank')">💬 Chat with CrimznBot</button>

  <br/><br/>
  <input type="text" id="pulse-input" placeholder="PulseIt sentiment..." />
  <button class="submit-button">PulseIt</button>

  <br/><br/>
  <a href="radar.html" class="button-link">📈 Cycle Top Radars</a>
  <a href="whitepaper.html" class="button-link">📄 View Whitepaper</a>

  <!-- ❌ Remove deploy number footer -->
  <script>
    const unwantedText = [...document.body.querySelectorAll("p")].find(p => p.textContent.toLowerCase().includes('deploy '));
    if (unwantedText) unwantedText.remove();
  </script>

  <script>
    const connectBtn = document.getElementById('connect-wallet');
    const disconnectBtn = document.getElementById('disconnect-wallet');
    const walletDiv = document.getElementById('wallet-address');
    let provider = null;

    connectBtn.addEventListener('click', async () => {
      try {
        provider = window.solana;
        if (!provider || !provider.isPhantom) throw new Error("Phantom wallet not found");
        const resp = await provider.connect();
        walletDiv.innerText = 'Connected: ' + resp.publicKey.toString().slice(-4);
        connectBtn.style.display = 'none';
        disconnectBtn.style.display = 'inline-block';
      } catch (err) {
        console.error('Wallet connect failed:', err);
      }
    });

    disconnectBtn.addEventListener('click', async () => {
      try {
        if (provider && provider.disconnect) await provider.disconnect();
        walletDiv.innerText = '';
        connectBtn.style.display = 'inline-block';
        disconnectBtn.style.display = 'none';
      } catch (err) {
        console.error('Wallet disconnect failed:', err);
      }
    });

    async function fetchPrices() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd");
        const data = await res.json();
        document.getElementById("btc-price").innerText = "$" + data.bitcoin.usd.toLocaleString();
        document.getElementById("eth-price").innerText = "$" + data.ethereum.usd.toLocaleString();
        document.getElementById("sol-price").innerText = "$" + data.solana.usd.toLocaleString();
      } catch (error) {
        console.error("Price fetch error:", error);
      }
    }

    fetchPrices();
    setInterval(fetchPrices, 30000);
  </script>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const chat = document.getElementById("chat-container");
      const msg = input.value.trim();
      if (!msg) return;

      // Show user message
      chat.innerHTML += `<div class="user-message">🧍 ${msg}</div>`;
      input.value = "";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question: msg })
        });
        const data = await res.json();
        const reply = data.response || "CrimznBot is having connection issues...";

        chat.innerHTML += `<div class="bot-response">🤖 ${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        chat.innerHTML += `<div class="bot-response">🤖 Error contacting CrimznBot.</div>`;
        console.error(err);
      }
    }
  </script>
</body>
</html>
