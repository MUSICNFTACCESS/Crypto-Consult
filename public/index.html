<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoConsult by Crimzn</title>
  <link rel="icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.73.2/lib/index.iife.min.js"></script>
</head>
<body>
  <h1>CryptoConsult by Crimzn</h1>

  <!-- Wallet Address Display -->
  <div id="wallet-display" style="position: absolute; top: 10px; right: 15px; font-size: 14px;"></div>

  <!-- Live Prices -->
  <div class="crypto-price" id="price-btc">BTC: N/A</div>
  <div class="crypto-price" id="price-eth">ETH: N/A</div>
  <div class="crypto-price" id="price-sol">SOL: N/A</div>

  <!-- Wallet Connect -->
  <div id="wallet-controls">
    <button class="solana-button" onclick="connectWallet()">Connect Wallet 👻</button>
  </div>

  <!-- CrimznBot -->
  <h2>Talk to CrimznBot</h2>
  <input type="text" id="userInput" placeholder="Ask me anything..." />
  <button class="submit-button" onclick="askCrimznBot()">Ask</button>
  <div id="chatBox" class="response-box"></div>

  <!-- Paywall -->
  <div id="paywall" class="hidden">
    <p>You've used 3 free questions. Please pay to continue:</p>
    <img src="solana-logo.svg" alt="Solana Pay" width="50" />
    <br /><br />
    <a class="solana-button" href="https://solana-pay.vercel.app/pay?recipient=Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF" target="_blank">Pay with Solana</a><br />
    <a class="button" href="https://commerce.coinbase.com/checkout/0193a8a5-c86f-407d-b5d7-6f89664fbdf8" target="_blank">Pay $99.99 USDC</a><br />
    <a class="button" href="https://commerce.coinbase.com/checkout/1d7cd946-d6ec-4278-b7ea-ee742b86982b" target="_blank">Tip 1 USDC</a><br />
    <a class="button" href="https://paypal.me/crimzn" target="_blank">Pay with PayPal</a>
  </div>

  <!-- PulseIt Sentiment Tool -->
  <h2 class="section-title">PulseIt Sentiment Analyzer</h2>
  <input type="text" id="sentimentInput" placeholder="Type a crypto news headline..." />
  <button class="submit-button" onclick="analyzeSentiment()">Analyze</button>
  <div class="pulse-response" id="pulseOutput"></div>

  <!-- Radar Button -->
  <br /><br />
  <a href="radar.html" class="button">📡 Cycle Top Radar</a>

<!-- Whitepaper Button -->
<a href="whitepaper.html" class="solana-button" style="margin-top: 10px; display: inline-block;">
  📜 View Whitepaper
</a>

  <!-- Script -->
  <script src="/script.js"></script>
</body>
</html>
