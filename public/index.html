<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoConsult by Crimzn</title>
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 2em;
    }
    .price-bar {
      margin: 20px 0;
    }
    .button-link, button {
      display: inline-block;
      margin: 8px;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    #submit-button {
      background-color: #f7931a;
      color: black;
    }
    .user-message {
      color: #f7931a;
      margin-top: 10px;
    }
    .bot-message {
      color: #00ff99;
      margin-top: 10px;
    }
    .pay-button {
      background-color: #3498db;
      color: white;
    }
    .solana-button {
      background-color: #8e44ad;
      color: white;
    }
    .ghost {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>CryptoConsult by Crimzn</h1>

  <div class="price-bar">
    <p>BTC: <span id="btc-price">Loading...</span></p>
    <p>ETH: <span id="eth-price">Loading...</span></p>
    <p>SOL: <span id="sol-price">Loading...</span></p>
  </div>

  <p><strong>💬 Talk to CrimznBot</strong></p>
  <div id="chat-container" style="border:1px solid #f7931a; padding:10px; height:200px; overflow-y:auto;"></div>
  <input type="text" id="user-input" placeholder="Ask your crypto question..." />
  <button id="submit-button">Send</button>

  <br><br>

  <button class="pay-button"
    onclick="window.open('https://commerce.coinbase.com/checkout/0193a8a5-c86f-407d-b5d7-6f89664fbdf8', '_blank')">
    💳 Pay for Consultation
  </button>

  <button class="pay-button"
    onclick="window.open('https://commerce.coinbase.com/checkout/6e5ff5c3-6bc2-4c8e-874a-f39e877c9d10', '_blank')">
    🙏 Tip Crimzn (1 USDC)
  </button>

  <button class="solana-button ghost"
    onclick="window.open('https://phantom.app/ul/browse/www.solanapay.com/pay/Co6bkf4NpatyTCbzjhoaTS63w93iK1DmzuooCSmHSAjF?amount=0.025', '_blank')">
    👻 Pay with Solana
  </button>

  <button class="button-link"
    onclick="window.open('https://t.me/CrimznBot', '_blank')">
    🤖 Chat with CrimznBot
  </button>

  <br><br>

  <form id="pulse-form">
    <input type="text" id="pulse-input" placeholder="PulseIt sentiment..." />
    <button type="submit">PulseIt</button>
    <div id="pulse-result" style="margin-top:10px;"></div>
  </form>

  <br><br>

  <a href="radar.html" class="button-link">🚨 Cycle Top Radar</a>
  <a href="whitepaper.html" class="button-link">📄 View Whitepaper</a>

  <script src="script.js?v=crimznfixed1" defer></script>
  <script src="wallet.js?v=crimzn1"></script>
</body>
</html>
