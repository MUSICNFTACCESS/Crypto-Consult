<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CryptoConsult by Crimzn</title>
  <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.73.2/lib/index.iife.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-wallets@0.18.10/lib/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@solana/wallet-adapter-base@0.9.15/lib/cjs/index.umd.js"></script>
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      padding: 20px;
    }
    .price-bar { font-size: 20px; margin-bottom: 10px; }
    .pay-button, .tip-button, .solana-button, .submit-button {
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      background-color: #7b3fe4;
      color: white;
    }
    .bot-response { color: #00ff73; }
    .user-message { color: #f7931a; margin-bottom: 10px; }
    .button-link { text-decoration: none; color: white; }
  </style>
</head>
<body>
  <h1>CryptoConsult by Crimzn</h1>

  <div id="wallet-connect">
    <button id="connect-wallet" class="solana-button">Connect Wallet</button>
    <button id="disconnect-wallet" class="solana-button" style="display: none;">Disconnect</button>
    <div id="wallet-address"></div>
  </div>

  <div class="price-bar">
    <p>BTC: <span id="btc-price">Loading...</span></p>
    <p>ETH: <span id="eth-price">Loading...</span></p>
    <p>SOL: <span id="sol-price">Loading...</span></p>
  </div>

  <strong>🧠 Talk to CrimznBot</strong>
  <div id="chat-container" style="border: 1px solid #f7931a; padding: 10px; height: 200px; overflow-y: auto;"></div>
  <input type="text" id="user-input" placeholder="Ask your crypto question..." />
  <button class="submit-button" onclick="sendMessage()">🔐 Send</button>

  <br><br>

  <button class="solana-button" onclick="window.open('https://commerce.coinbase.com/checkout/0193ba85-c86f-407d-b5d7-6f896d67d70f', '_blank')">💳 Pay for Consultation</button>
  <button class="solana-button" onclick="window.open('https://commerce.coinbase.com/checkout/e57a50a8-26cf-4d75-b70d-b03aa5b555ae', '_blank')">💸 Tip (1 USDC)</button>
  <button class="solana-button" onclick="window.open('https://t.me/crimznbot', '_blank')">💬 Chat with CrimznBot</button>

  <br><br>

  <input id="pulse-input" class="solana-button" placeholder="PulseIt sentiment..." />
  <button class="solana-button">📊 PulseIt</button>

  <br><br>
  <a href="radar.html" class="button-link">📈 Cycle Top Radars</a> |
  <a href="whitepaper.html" class="button-link">📄 View Whitepaper</a>

  <script>
    const unwantedText = [...document.body.querySelectorAll("*")].find(n => n.textContent?.toLowerCase()?.includes("deploy"));
    if (unwantedText) unwantedText.remove();

    const connectBtn = document.getElementById('connect-wallet');
    const disconnectBtn = document.getElementById('disconnect-wallet');
    const walletAddress = document.getElementById('wallet-address');

    connectBtn.addEventListener('click', async () => {
      try {
        if (!window.solana || !window.solana.isPhantom) throw new Error("Phantom wallet not found");
        const resp = await window.solana.connect();
        walletAddress.innerText = '🔗 ' + resp.publicKey.toString().slice(-4);
        connectBtn.style.display = 'none';
        disconnectBtn.style.display = 'inline-block';
      } catch (err) {
        console.error('Wallet connect failed:', err);
      }
    });

    disconnectBtn.addEventListener('click', async () => {
      try {
        if (window.solana?.disconnect) await window.solana.disconnect();
        walletAddress.innerText = '';
        connectBtn.style.display = 'inline-block';
        disconnectBtn.style.display = 'none';
      } catch (err) {
        console.error('Wallet disconnect failed:', err);
      }
    });

    async function fetchPrices() {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd");
        const data = await res.json();
        document.getElementById("btc-price").innerText = "$" + data.bitcoin.usd.toLocaleString();
        document.getElementById("eth-price").innerText = "$" + data.ethereum.usd.toLocaleString();
        document.getElementById("sol-price").innerText = "$" + data.solana.usd.toLocaleString();
      } catch (error) {
        console.error("Price fetch error:", error);
      }
    }
    fetchPrices();
    setInterval(fetchPrices, 30000);

    let questionCount = 0;
    const maxFreeQuestions = 3;

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const chat = document.getElementById("chat-container");
      const question = input.value;
      input.value = "";

      chat.innerHTML += `<div class="user-message">🧍‍♂️ ${question}</div>`;

      if (questionCount >= maxFreeQuestions) {
        chat.innerHTML += `
          <div class="bot-response">
            🚧 You've reached the free question limit.<br>
            <a href="https://commerce.coinbase.com/checkout/0193ba85-c86f-407d-b5d7-6f896d67d70f" class="button-link" target="_blank">
              <button class="solana-button">💳 Pay $99.99 USDC</button>
            </a>
            <a href="https://commerce.coinbase.com/checkout/e57a50a8-26cf-4d75-b70d-b03aa5b555ae" class="button-link" target="_blank">
              <button class="solana-button">💸 Tip 1 USDC</button>
            </a>
            <a href="https://t.me/crimznbot" class="button-link" target="_blank">
              <button class="solana-button">💬 Contact on Telegram</button>
            </a>
          </div>`;
        return;
      }

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        const reply = data.reply || "⚠️ CrimznBot is having connection issues...";
        chat.innerHTML += `<div class="bot-response">🤖 ${reply}</div>`;
        questionCount++;
        chat.scrollTop = chat.scrollHeight;
      } catch (err) {
        chat.innerHTML += `<div class="bot-response">⚠️ Error contacting CrimznBot.</div>`;
      }
    }
  </script>
</body>
</html>
