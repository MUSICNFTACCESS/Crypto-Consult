<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📡 Cycle Top Radar</title>
  <style>
    body { background: #000; color: #f7931a; font-family: Courier, monospace; text-align: center; padding: 20px; }
    h1 { font-size: 2em; margin-bottom: 10px; }
    .button { background: #f7931a; color: #000; padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .metrics, .charts, .footer { margin: 20px 0; }
    table { margin: 0 auto; background: #222; border-collapse: collapse; color: #f7931a; }
    td { padding: 8px 16px; border: 1px solid #f7931a; }
    a { color: #00bfff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>📡 Cycle Top Radar</h1>
  <div class="metrics">
    <p id="cycle-status">Loading...</p>
    <p>Fear & Greed Index: <strong id="cycle-fear">…</strong></p>
    <p>BTC Dominance: <strong id="btc-dom">…</strong></p>
  </div>

  <h2>🟧 Altcoin Heatmap (24h %)</h2>
  <table>
    <tbody id="heatmap-table"></tbody>
  </table>

  <div class="charts">
    <h2>📊 Live Charts</h2>
    <div>
      <button class="button" onclick="loadChart('BTCUSDT')">BTC</button>
      <button class="button" onclick="loadChart('ETHUSDT')">ETH</button>
      <button class="button" onclick="loadChart('SOLUSDT')">SOL</button>
    </div>
    <iframe id="tv-chart" src="" width="100%" height="500" frameborder="0" allowfullscreen></iframe>
  </div>

  <div class="footer">
    <a href="/">← Back to Homepage</a>
    <h3>🧠 ETF Flow Dashboards</h3>
    <button class="button" onclick="window.open('https://blockworks.co/analytics/bitcoin-etf/tracker','_blank')">🔶 BTC ETF Tracker</button>
    <button class="button" onclick="window.open('https://blockworks.co/analytics/ethereum-etf/tracker','_blank')">🔷 ETH ETF Tracker</button>
  </div>

  <script>
    async function fetchMetrics() {
      const res = await fetch("/api/cycle-top-status");
      const d = await res.json();
      document.getElementById("cycle-status").textContent = d.status;
      document.getElementById("cycle-fear").textContent = `${d.fngValue} (${d.fngLabel})`;
      document.getElementById("btc-dom").textContent = `${d.btcDominance.toFixed(1)}%`;
    }

    async function loadHeatmap() {
      const coins = ['BTC','ETH','SOL','AVAX','LINK','ONDO','PEPE'];
      const tbody = document.getElementById("heatmap-table");
      tbody.innerHTML = '';
      for (let c of coins) {
        try {
          const r = await fetch(`https://api.coingecko.com/api/v3/coins/${c.toLowerCase()}`);
          const j = await r.json();
          const chg = j.market_data.price_change_percentage_24h?.toFixed(2) ?? 'N/A';
          const color = chg === 'N/A' ? '#555' : chg >= 0 ? '#0f0' : '#f00';
          tbody.innerHTML += `<tr><td>${c}</td><td style="color:${color}">${chg}%</td></tr>`;
        } catch (_) {
          tbody.innerHTML += `<tr><td>${c}</td><td>N/A</td></tr>`;
        }
      }
    }

    function loadChart(symbol) {
      document.getElementById("tv-chart").src = 
        `https://s.tradingview.com/embed-widget/mini-symbol-overview/?symbol=BINANCE%3A${symbol}&locale=en#%7B%7D`;
    }

    fetchMetrics();
    loadHeatmap();
    loadChart("BTCUSDT");
    setInterval(fetchMetrics, 60000);
    setInterval(loadHeatmap, 1800000);
  </script>
</body>
</html>
