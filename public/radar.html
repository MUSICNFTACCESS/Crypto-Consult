<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🧠 Cycle Top Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 22px;
      margin-top: 0.5em;
    }
    .tab {
      background: #111;
      display: inline-block;
      padding: 10px 12px;
      margin: 3px;
      border: 2px solid #f7931a;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .tab.active {
      background-color: #f7931a;
      color: black;
    }
    iframe {
      display: none;
      width: 100%;
      height: 600px;
      border: none;
    }
    .iframe-wrap {
      margin-top: 20px;
    }
    .back-button {
      margin-top: 1em;
      display: inline-block;
      background-color: #f7931a;
      color: #000;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>📡 On The Radar: Crypto Cycle Top Dashboard</h1>
  <p>🧠 Visualize key crypto metrics to time market cycles, spot tops, and confirm trends.</p>

  <!-- Tab Buttons -->
  <div class="tab active" data-id="btc-usd">BTC/USD</div>
  <div class="tab" data-id="eth-usd">ETH/USD</div>
  <div class="tab" data-id="sol-usd">SOL/USD</div>
  <div class="tab" data-id="eth-btc">ETH/BTC</div>
  <div class="tab" data-id="sol-btc">SOL/BTC</div>
  <div class="tab" data-id="btc-dominance">BTC Dominance</div>

  <!-- Tab Content -->
  <div class="iframe-wrap">
    <iframe id="btc-usd" style="display: block;"
      src="https://s.tradingview.com/widgetembed/?symbol=BITSTAMP:BTCUSD&interval=1D&theme=dark&style=1&toolbarbg=F1F3F6&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=1&hideideas=1">
    </iframe>
    <iframe id="eth-usd"
      src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:ETHUSDT&interval=1D&theme=dark&style=1&toolbarbg=F1F3F6&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=1&hideideas=1">
    </iframe>
    <iframe id="sol-usd"
      src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:SOLUSDT&interval=1D&theme=dark&style=1&toolbarbg=F1F3F6&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=1&hideideas=1">
    </iframe>
    <iframe id="eth-btc"
      src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:ETHBTC&interval=1D&theme=dark&style=1&toolbarbg=F1F3F6&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=1&hideideas=1">
    </iframe>
    <iframe id="sol-btc"
      src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:SOLBTC&interval=1D&theme=dark&style=1&toolbarbg=F1F3F6&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=1&hideideas=1">
    </iframe>
    <iframe id="btc-dominance"
      src="https://s.tradingview.com/widgetembed/?symbol=CRYPTOCAP:BTC.D&interval=1D&theme=dark&style=1&toolbarbg=F1F3F6&withdateranges=1&hide_side_toolbar=false&allow_symbol_change=1&hideideas=1">
    </iframe>
  </div>

  <a href="/index.html" class="back-button">🔙 Back to Home</a>

  <!-- Script -->
  <script>
    const tabs = document.querySelectorAll('.tab');
    const sections = document.querySelectorAll('.iframe-wrap iframe');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const id = tab.getAttribute('data-id');
        sections.forEach(sec => sec.style.display = 'none');
        document.getElementById(id).style.display = 'block';
      });
    });
  </script>
</body>
</html>
