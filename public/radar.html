<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📡 Cycle Top Radar</title>
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 0.5em;
    }
    h1 {
      font-size: 20px;
      margin-top: 0.5em;
    }
    .tab {
      background: #111;
      color: white;
      display: inline-block;
      padding: 0.5em 1em;
      margin: 0.25em;
      border: 1px solid #f7931a;
      border-radius: 5px;
      cursor: pointer;
    }
    .tab.active {
      background: #f7931a;
      color: black;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 0.5em;
    }
    .back-button {
      display: inline-block;
      margin: 1em;
      background-color: #f7931a;
      color: black;
      text-decoration: none;
      font-weight: bold;
      font-family: monospace;
      border-radius: 8px;
      padding: 0.5em 1em;
    }
  </style>
</head>
<body>
  <h1>📡 The Radar</h1>
  <p>This dashboard helps visualize potential crypto market cycle tops using key metrics, charts, and ETF flows.</p>

  <!-- Chart Tabs -->
  <div id="chart-tabs">
    <div class="tab active" onclick="setChart('btc')">📈 BTC/USD</div>
    <div class="tab" onclick="setChart('eth')">📉 ETH/USD</div>
    <div class="tab" onclick="setChart('sol')">⚡ SOL/USD</div>
  </div>

  <!-- Chart Embed -->
  <div id="chart-container">
    <iframe id="tv-chart" src="https://www.tradingview.com/chart/" allowfullscreen></iframe>
  </div>

  <!-- Fear & Greed -->
  <h2>Fear & Greed Index</h2>
  <iframe 
    src="https://alternative.me/crypto/fear-and-greed-index/" 
    width="100%" height="300" style="border:0;" 
    title="Crypto Fear and Greed Index">
  </iframe>

  <!-- ETF Trackers -->
  <h2>ETF Inflows (BTC & ETH)</h2>
  <a href="https://www.farside.co.uk/" target="_blank" class="tab">🔍 View BTC ETF Flows (Farside)</a>
  <a href="https://pro.nansen.ai/etf" target="_blank" class="tab">📊 View ETH ETF Flows (Nansen)</a>

  <!-- Back Button -->
  <a href="index.html" class="back-button">⬅️ Back to Main Page</a>

  <!-- Script -->
  <script>
    function setChart(coin) {
      const tabs = document.querySelectorAll('.tab');
      tabs.forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');

      let url;
      if (coin === 'btc') {
        url = 'https://www.tradingview.com/chart/?symbol=COINBASE:BTCUSD';
      } else if (coin === 'eth') {
        url = 'https://www.tradingview.com/chart/?symbol=COINBASE:ETHUSD';
      } else if (coin === 'sol') {
        url = 'https://www.tradingview.com/chart/?symbol=COINBASE:SOLUSD';
      }
      document.getElementById('tv-chart').src = url;
    }
  </script>
</body>
</html>
