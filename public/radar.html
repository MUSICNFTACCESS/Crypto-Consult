<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📡 Cycle Top Radar</title>
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', monospace;
      text-align: center;
      margin: 0;
      padding: 0.5em;
    }
    h1 {
      font-size: 20px;
      margin-top: 0.5em;
    }
    .tab {
      background: #111;
      color: white;
      display: inline-block;
      padding: 0.5em 1em;
      margin: 0.25em;
      border: 1px solid #f7931a;
      border-radius: 5px;
      cursor: pointer;
    }
    .tab.active {
      background: #f7931a;
      color: black;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 0.5em;
    }
    .back-button {
      display: inline-block;
      margin: 1em;
      background-color: #f7931a;
      color: black;
      text-decoration: none;
      font-weight: bold;
      font-family: monospace;
      border-radius: 8px;
      padding: 0.5em 1em;
    }
  </style>
</head>
<body>
  <h1>📡 The Radar</h1>
  <p>This dashboard helps visualize potential crypto market cycle tops using key metrics, charts, and ETF flows.</p>

  <!-- Tabs -->
  <div id="chart-tabs">
    <div class="tab active" onclick="setChart('btc')">📈 BTC/USD</div>
    <div class="tab" onclick="setChart('ethbtc')">🔁 ETH/BTC</div>
    <div class="tab" onclick="setChart('solbtc')">⚡ SOL/BTC</div>
    <div class="tab" onclick="setChart('fear')">😱 Fear & Greed</div>
    <div class="tab" onclick="setChart('heatmap')">🌡️ Altcoin Heatmap</div>
  </div>

  <!-- Iframes -->
  <div id="iframe-container">
    <iframe id="btc" src="https://www.tradingview.com/embed-widget/mini-symbol-overview/?symbol=BITSTAMP:BTCUSD&locale=en" style="display:block;"></iframe>
    <iframe id="ethbtc" src="https://www.tradingview.com/embed-widget/mini-symbol-overview/?symbol=BINANCE:ETHBTC&locale=en" style="display:none;"></iframe>
    <iframe id="solbtc" src="https://www.tradingview.com/embed-widget/mini-symbol-overview/?symbol=BINANCE:SOLBTC&locale=en" style="display:none;"></iframe>
  </div>

  <a href="/index.html" class="back-button">⬅️ Back to Home</a>

  <script>
    function setChart(chartId) {
      const tabs = document.querySelectorAll(".tab");
      const iframes = document.querySelectorAll("iframe");
      tabs.forEach(tab => tab.classList.remove("active"));
      iframes.forEach(iframe => iframe.style.display = "none");
      document.getElementById(chartId).style.display = "block";
      event.target.classList.add("active");
    }
  </script>
</body>
</html>
