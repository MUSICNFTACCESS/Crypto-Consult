<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📉 Cycle Top Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 22px; margin-top: 0.5em; }
    .tab {
      background: #111;
      display: inline-block;
      padding: 10px 12px;
      margin: 4px;
      border: 1px solid #f7931a;
      border-radius: 8px;
      font-size: 12px;
      user-select: none;
      cursor: pointer;
    }
    .tab.active {
      background-color: #f7931a;
      color: black;
    }
    .iframe-wrap {
      display: none;
      margin-top: 20px;
      width: 100%;
      height: 500px;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
    .back-button {
      margin-top: 1em;
      display: inline-block;
      background-color: #f7931a;
      color: black;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>📊 The Radar: Crypto Cycle Top Dashboard</h1>
  <p>Visualize key crypto metrics to time market cycles, spot tops, and confirm trends.</p>

  <!-- Tab Buttons -->
  <div class="tab active" data-id="btc">🟧 BTC/USD</div>
  <div class="tab" data-id="ethbtc">🟣 ETH/BTC</div>
  <div class="tab" data-id="solbtc">🟡 SOL/BTC</div>
  <div class="tab" data-id="btcd">📘 BTC Dominance</div>

  <!-- Tab Content -->
  <div id="btc" class="iframe-wrap" style="display: block;">
    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_btc&symbol=BITSTAMP%3ABTCUSD&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hidevolume=1" allowfullscreen></iframe>
  </div>

  <div id="ethbtc" class="iframe-wrap">
    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_ethbtc&symbol=BINANCE%3AETHBTC&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hidevolume=1" allowfullscreen></iframe>
  </div>

  <div id="solbtc" class="iframe-wrap">
    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_solbtc&symbol=BINANCE%3ASOLBTC&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hidevolume=1" allowfullscreen></iframe>
  </div>

  <div id="btcd" class="iframe-wrap">
    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_btcd&symbol=CRYPTOCAP%3ABTC.D&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC&withdateranges=1&hidevolume=1" allowfullscreen></iframe>
  </div>

  <br />
  <a href="/" class="back-button">🔙 Back to Home</a>

  <!-- Script -->
  <script>
    const tabs = document.querySelectorAll(".tab");
    const sections = document.querySelectorAll(".iframe-wrap");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const id = tab.getAttribute("data-id");
        sections.forEach(sec => sec.style.display = "none");
        document.getElementById(id).style.display = "block";
      });
    });
  </script>
</body>
</html>
