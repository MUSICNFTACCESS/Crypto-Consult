<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📈 Cycle Top Radar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #000;
      color: #f7931a;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 20px;
    }
    .tab {
      background: #111;
      color: white;
      padding: 6px 14px;
      margin: 3px;
      border: 1px solid #222;
      border-radius: 8px;
      display: inline-block;
      font-family: monospace;
      cursor: pointer;
    }
    .tab.active {
      background: #f7931a;
      color: black;
    }
    .widget-container {
      display: none;
      margin-top: 20px;
    }
    .external-button {
      background-color: #222;
      color: #f7931a;
      padding: 6px 14px;
      margin: 3px;
      border: 1px solid #444;
      border-radius: 8px;
      text-decoration: none;
      display: none;
    }
    .external-button:hover {
      background-color: #f7931a;
      color: black;
    }
    .back-button {
      background-color: #f7931a;
      color: black;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      margin-top: 1em;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>📊 The Radar: Crypto Cycle Top Dashboard</h1>
  <p>Visualize key crypto metrics to time market cycles, spot tops, and confirm trends.</p>

  <!-- Tab Buttons -->
  <div class="tab" data-target="btc">📉 BTC/USD</div>
  <div class="tab" data-target="ethbtc">🟪 ETH/BTC</div>
  <div class="tab" data-target="solbtc">👻 SOL/BTC</div>
  <div class="tab" data-target="btcdom">🟠 BTC Dominance</div>
  <div class="tab" data-target="fear">😱 Fear & Greed</div>
  <div class="tab" data-target="heatmap">🌐 Heatmap</div>
  <div class="tab" data-target="funding">📉 Funding</div>

  <!-- Widgets -->
  <div class="widget-container" id="btc">
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "BINANCE:BTCUSDT",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "btc"
      });
    </script>
  </div>

  <div class="widget-container" id="ethbtc">
    <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "BINANCE:ETHBTC",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "ethbtc"
      });
    </script>
  </div>

  <div class="widget-container" id="solbtc">
    <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "BINANCE:SOLBTC",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "solbtc"
      });
    </script>
  </div>

  <div class="widget-container" id="btcdom">
    <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": 500,
        "symbol": "CRYPTOCAP:BTC.D",
        "interval": "D",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#f1f3f6",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "btcdom"
      });
    </script>
  </div>

  <!-- External Link Buttons -->
  <a href="https://alternative.me/crypto/fear-and-greed-index/" target="_blank" class="external-button" id="fear">😱 Fear & Greed</a>
  <a href="https://coin360.com/heatmap" target="_blank" class="external-button" id="heatmap">🌐 Heatmap</a>
  <a href="https://coinglass.com/funding-rate" target="_blank" class="external-button" id="funding">📉 Funding Rates</a>

  <br><br>
  <a href="/home.html" class="back-button">⬅️ Back to Home</a>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const widgets = document.querySelectorAll(".widget-container");
    const links = document.querySelectorAll(".external-button");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        // Highlight active tab
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");

        const target = tab.getAttribute("data-target");

        // Hide all widgets and buttons
        widgets.forEach(w => w.style.display = "none");
        links.forEach(l => l.style.display = "none");

        const widget = document.getElementById(target);
        if (widget) widget.style.display = "block";

        const link = document.getElementById(target);
        if (link && link.tagName === "A") link.style.display = "inline-block";
      });
    });
  </script>
</body>
</html>
